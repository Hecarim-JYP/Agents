# 템플릿 자체의 의존성 취약점 검사 (scripts/template-audit.mjs) — Spring build.gradle 템플릿을 조립해
# scaffolds/default.md의 audit.yml 검사 단계를 그대로 돌린다. 생성된 프로젝트는 각자 audit.yml이 검사하지만
# 템플릿 고정값은 아무도 검사하지 않았다 — 지금 고정한 버전에 새 취약점이 공개되면 여기서 알린다.
# 대조군: 알려진 취약 의존성을 넣은 조립본은 반드시 실패해야 한다 — 통과하면 검사 단계가 고장 난 것이다.
name: template-audit

on:
  push:
    branches: ['**']
    paths:
      - 'scaffolds/templates/build.gradle'
      - 'scaffolds/templates/osv-lock.gradle'
      - 'scaffolds/default.md'          # audit.yml 템플릿이 여기 있다
      - 'conventions/spring.md'         # 래퍼 버전(--gradle-version)
      - 'scripts/template-audit.mjs'
      - '.github/workflows/template-audit.yml'
  schedule:
    - cron: '29 0 * * 1'   # 매주 월요일 09:29 KST — 예약 실행은 기본 브랜치(main) 기준
  workflow_dispatch:

jobs:
  template-audit:
    runs-on: ubuntu-latest   # gradle(래퍼 생성)·jq·curl이 기본 설치돼 있다
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25     # build.gradle 템플릿 toolchain과 같은 LTS (general.md 8-1절)
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/template-audit.mjs            # 템플릿 그대로 — high 이상 0건이어야 한다
      - run: node scripts/template-audit.mjs --control  # 대조군 — 검출해야 통과
