# 배포 모드 — 개발서버·운영서버 공통 (docker.md 4-1절)
# 두 서버의 차이는 이 파일이 아니라 각 서버 .env의 값뿐 (SITE_ADDRESS, DB 자격, DEPLOY_TAG).
# 로컬에서 배포 전 검증할 때도 같은 파일을 쓴다.
# 이미지는 CI가 빌드해 ghcr.io에 push한 것을 pull만 한다 (docker.md 5절) — build: 금지.
#
# ⚠ 한 호스트에 운영·개발 스택을 함께 올린다면 (docker.md 7-2절):
#    .env의 COMPOSE_PROJECT_NAME을 스택마다 다르게 설정한다 — 안 하면 컨테이너·네트워크·
#    볼륨 이름이 겹쳐 개발 스택이 운영 DB 볼륨을 붙잡는다. HTTP_PORT/HTTPS_PORT도 분리한다.

# 컨테이너 로그 크기 제한 — 모든 서비스에 적용한다 (docker.md 6절). Docker 기본(json-file)은 제한이 없다:
# 실측 40만 줄에 103MB가 그대로 쌓였고, max-size 10m·max-file 3이면 26MB에서 멈췄다 (docker logs는 최근분 그대로).
# json-file 유지 — 사내 로그 수집기가 읽는 형식. 바꾸면 기존 컨테이너는 다시 만들어야 적용된다 (up -d가 재생성)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    logging: *default-logging
    # 사내망 전용 기본: nginx-unprivileged (체크리스트 15에서 선택 — docker.md 7절)
    image: nginxinc/nginx-unprivileged:1.30-alpine   # 안정판(짝수) 계열 — 1.27은 2025-06 이후 갱신 없음 (2026-10-19 확인)
    ports:
      - "${HTTP_PORT:?HTTP_PORT 미설정}:8080"   # 외부에 열리는 포트는 프록시뿐 (docker.md 7절)
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [client, server]
    restart: unless-stopped
    networks: [app]
    # 외부 노출 + 도메인(자동 HTTPS)이면 Caddy로 교체 (docker.md 7절):
    #   image: caddy:2-alpine
    #   environment:
    #     SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 미설정}
    #   ports:
    #     - "${HTTP_PORT:?HTTP_PORT 미설정}:80"
    #     - "${HTTPS_PORT:?HTTPS_PORT 미설정}:443"   # 운영 80/443, 같은 호스트의 개발 스택은 8080/8443 등
    #   volumes:
    #     - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    #     - caddy-data:/data                # 발급받은 인증서 — 지우면 재발급 (rate limit 주의)
    #     - caddy-config:/config

  client:
    logging: *default-logging
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX 미설정}-client:${DEPLOY_TAG:?DEPLOY_TAG 미설정}
    restart: unless-stopped

  server:
    logging: *default-logging
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX 미설정}-server:${DEPLOY_TAG:?DEPLOY_TAG 미설정}
    volumes:
      - uploads:/app/uploads            # 마운트 지점은 이미지에 실행 사용자 소유로 선생성 (docker.md 2절)
    restart: unless-stopped

  db:
    logging: *default-logging
    restart: unless-stopped
    # 운영 서버는 DB 포트를 호스트에 노출하지 않는다 (ops.md — 관리 접속은 SSH 터널).
    # 개발 서버에서 DB 툴 접속이 필요하면 사내망 한정으로만 노출:
    # ports:
    #   - "127.0.0.1:${DB_PORT}:3306"

  # 마이그레이션 — 앱 기동과 분리된 별도 단계 (docker.md 5절)
  # 실행: docker compose run --rm migrate
  migrate:
    logging: *default-logging
    profiles: ["tools"]                 # 기본 up 대상에서 제외 — 명시적으로만 실행
    image: flyway/flyway:12             # JVM/Flyway 프로젝트 — 10은 MariaDB 11.4를 "지원 검증 안 된 버전"으로 경고(최신 지원 11.2), 12는 경고 없음 (2026-10-19 실측)
                                        # 13이 최신(2026-10-21: 13.10.3)이지만 Spring Boot 4.1.1이 관리하는 Flyway가 12.4.0이라 같은 메이저로 맞춘다 — Boot가 13으로 올리면 함께
    command: >
      -url=jdbc:mariadb://db:3306/${DB_NAME}
      -user=${DB_USER} -password=${DB_PASSWORD}
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [app]
    # Node 프로젝트는 위 image/command 대신 서버 이미지의 러너를 쓴다:
    #   image: ${IMAGE_PREFIX}-server:${DEPLOY_TAG}
    #   command: ["npm", "run", "migrate"]

  # 정기 배치 — 호스트 cron이 호출한다 (batch.md 1절 (b) 방식)
  # 실행: docker compose run --rm batch <작업명> --date=YYYY-MM-DD
  batch:
    logging: *default-logging
    profiles: ["tools"]
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX 미설정}-server:${DEPLOY_TAG:?DEPLOY_TAG 미설정}
    entrypoint: ["node", "dist/batch/index.js"]   # Spring: ["java","-jar","app.jar","--spring.batch.job.name="]
    environment:
      TZ: Asia/Seoul                    # 컨테이너 기본 UTC — 배치 시각이 밀린다 (batch.md 2절)
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  # 백업 — 호스트 cron이 호출한다 (ops.md 6절). DB 위치가 (b) 호스트 로컬 / (c) 외부 매니지드면 삭제 (docker.md 4-2절)
  # 실행: docker compose run --rm backup   /  복원 리허설: docker compose run --rm backup restore <파일명>
  backup:
    logging: *default-logging
    profiles: ["tools"]
    image: mariadb:11.4                 # db와 같은 이미지 — 덤프 도구가 서버 버전과 맞고 gzip·openssl이 들어 있다
    entrypoint: ["bash", "/scripts/backup.sh"]
    user: "${BACKUP_UID:?BACKUP_UID 미설정}:${BACKUP_GID:?BACKUP_GID 미설정}"   # 배포 계정(id -u / id -g) — 기본(root)으로 돌면 파일이 root 소유 600이라 배포 계정이 다른 호스트로 복사하지 못한다 (실측)
    environment:
      TZ: Asia/Seoul                    # 파일명·보관 기간 기준
      DB_NAME: ${DB_NAME:?DB_NAME 미설정}
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 미설정}   # 명령줄 -p 대신 — 프로세스 목록에 비밀번호가 남지 않는다
      BACKUP_KEY: ${BACKUP_KEY:?BACKUP_KEY 미설정}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:?BACKUP_KEEP_DAYS 미설정}
      DISK_ALERT_PCT: ${DISK_ALERT_PCT:?DISK_ALERT_PCT 미설정}   # 디스크 사용률 기준 — 넘으면 DISK_CHECK 실패 (ops.md 8절)
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - db-data:/data/db:ro             # 디스크 사용률을 재는 용도 — 파일은 읽지 않는다
      - uploads:/data/uploads:ro        # 업로드 기능이 없으면 이 줄 삭제 (스크립트가 건너뛴다)
      - ${BACKUP_DIR:?BACKUP_DIR 미설정}:/backup   # 호스트 경로 — 여기서 다른 호스트로 복사한다 (ops.md 6절)
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

volumes:
  caddy-data:                           # Caddy 채택 시에만 사용
  caddy-config:
