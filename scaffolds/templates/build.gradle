// server/build.gradle — Spring Boot 서버 빌드 설정 (spring.md 0·7절)
// Spring Initializr 산출물이 기본이다. Initializr에 접근할 수 없을 때만 이 파일로 시작한다 — 기억으로 쓰지 않는다
// (근거: 학습 데이터의 기본값은 Boot 3.x — 3.x는 2026-06-25 3.5.16을 끝으로 OSS 지원이 끝났다).
// ⚠ 생성 시 아래 버전을 Maven Central·Gradle Plugin Portal의 최신 GA로 갱신하고 CLAUDE.md에 기록한다.
//   실빌드 검증: Boot 4.1.2 · Gradle 9.8.2 · Spotless 8.10.4 · Checkstyle 14.3.0 · ArchUnit 1.5.1 — Java 25(2026-10-27)
//   (이전: Boot 4.1.1 — Java 21(2026-10-19)·Java 25(2026-10-20))
//   테스트 클래스 병렬 + ArchitectureTest 병렬 규칙: Java 25(2026-10-27) — spring.md 7절
//   Java는 LTS만 (general.md 8-1절) — 25(2031-09 지원 종료). 선택한 버전·지원 종료일을 CLAUDE.md에 기록한다
// 함께 만드는 파일: config/checkstyle/checkstyle.xml(템플릿), config/header.txt(파일 헤더 주석), .gitattributes(* text=auto eol=lf),
//   gradle/osv-lock.gradle(템플릿 — 취약점 검사용, ops.md 5-1절)

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'checkstyle'
}

group = '{base.package}'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// 보안 패치 덮어쓰기 — Boot가 관리하는 버전에 알려진 취약점이 있을 때만, 같은 계열의 최신 패치로 (ops.md 5-1절)
// Boot가 이 버전 이상을 관리하게 되면 지운다 — check-versions.mjs가 "덮어쓰기 삭제"로 알린다. 지운 뒤 취약점 검사(audit.yml)를 다시 돌린다
// 2026-10-21 Boot 4.1.1 기준 (OSV): Jackson 3.1.5 — jackson-core GHSA-7hhh-6rmp-j9qf·GHSA-p6pp-m3f8-5c89, databind GHSA-cxp5-3px4-pw24 외 4건 (CVSS 최고 7.5, 3.1.7 수정)
// 2026-10-27 Boot 4.1.2: Tomcat은 Boot가 11.0.27(수정 포함)을 관리해 덮어쓰기를 지웠다. Jackson은 Boot 3.1.7 < 이 값 3.1.8이라 남긴다
ext['jackson-bom.version'] = '3.1.8'

dependencies {
    // Boot 4는 스타터 이름이 바뀌었다 — web이 아니라 webmvc, 테스트도 기술별 스타터(webmvc-test)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'   // 마이그레이션은 별도 단계 — spring.flyway.enabled=false (spring.md 0절)
    implementation 'org.flywaydb:flyway-mysql'                              // MariaDB·MySQL 방언

    // 데이터 접근 — 체크리스트 24 선택 하나만 남긴다
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'     // (a) JdbcClient (기본)
    // (b) JPA + QueryDSL — 원 저장소(com.querydsl)는 2024-01 5.1.0 이후 출시가 없어 유지보수 중인 포크를 쓴다
    // implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    // annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    // annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    // (c) MyBatis — 스타터의 Boot 대응 버전을 맞춘다 (4.0.x ↔ Boot 4.0, 4.1.x ↔ Boot 4.1)
    // implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'   // @WebMvcTest·MockMvc·JUnit Jupiter·Mockito
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'                         // 패키지 순환 의존 검사 (spring.md 7절)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 클래스끼리 병렬 실행 (spring.md 7절) — JUnit 스레드 병렬이라 JVM 하나에서 Spring 컨텍스트 캐시를 함께 쓴다.
    // 같은 클래스의 메서드는 차례대로. 기본값(병렬 꺼짐)이면 클래스가 하나씩 차례로 돈다 (2026-10-27 실측 수치는 spring.md 7절).
    // ⚠ 병렬이면 깨지는 것: 같은 테스트 DB를 쓰는 클래스끼리, 같은 컨트롤러의 @WebMvcTest끼리(@MockitoBean 공유) — ArchitectureTest가 잠금·분리를 강제한다
    // 테스트 JVM 힙 기본값은 512MB(Gradle) — 컨텍스트가 많아 OutOfMemoryError가 나면 maxHeapSize = '1g'
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    // 실패한 테스트 이름과 단언 내용을 콘솔에 — Stop 훅이 이 출력을 그대로 Claude에게 넘긴다 (없으면 "보고서를 보라"만 남는다)
    // 훅은 `gradlew test --quiet`로 돌기 때문에 quiet 수준에도 같은 설정을 둔다 (기본 수준 설정만으로는 --quiet에서 안 나온다 — 실측)
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        quiet {
            events 'failed'
            exceptionFormat = 'full'
        }
    }
}

// 포맷·정적 검사 — check에 묶여 CI·훅이 강제한다 (spring.md 7절)
spotless {
    lineEndings = 'UNIX'                         // .gitattributes가 없어도 LF 기준 (Windows CRLF 함정)
    java {
        googleJavaFormat()
        removeUnusedImports()
        licenseHeaderFile 'config/header.txt'    // 파일 헤더 주석 강제 (general.md 5절)
    }
}

checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}
