# proxy 컨테이너(nginx-unprivileged)의 라우팅 설정 (docker.md 7절).
# 사내망 전용(HTTP) 기본 — 외부 노출 + 자동 HTTPS가 필요하면 Caddy를 쓴다 (체크리스트 15).
# 라우팅 규약은 Caddyfile과 동일: /api/* 와 /health 는 server로, 그 외는 client로.

server {
    listen 8080;
    listen [::]:8080;        # IPv6도 함께 (docker.md 2-3절과 동일한 이유)
    server_name _;

    # 앱이 클라이언트 IP·프로토콜을 판별하려면 X-Forwarded-* 전달이 필수 (docker.md 7절 trust proxy)
    # X-Forwarded-For는 클라이언트가 보낸 값에 이어 붙이지 않고 접속 IP로 덮어쓴다 — 이어 붙이면 위조값이 앞에 남아
    # Spring(framework·native 모두)이 위조 IP를 채택한다 (features/rate-limit.md 3-1절, 2026-10-16 실측).
    # 이 프록시 앞에 LB·CDN이 생기면 real_ip 모듈로 $remote_addr를 복원한 뒤 이 줄을 유지한다
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 업로드 상한 — nginx 기본은 1m라 엑셀·첨부 업로드가 HTML 413으로 막힌다 (2026-10-14 실측).
    # 앱의 업로드 상한(multer limits / spring.servlet.multipart)보다 크게 둬야 앱이 우리 에러 봉투로 응답한다 (express.md 6절)
    client_max_body_size 20m;

    # 앱·client가 내려가 있는 동안(배포·재시작) — /api는 JSON 503, 화면은 안내 HTML 503 (features/maintenance-mode.md 3-1절)
    # 502·504(프록시가 앱에 못 닿음)만 바꾼다 — proxy_intercept_errors는 켜지 않는다(앱이 보낸 에러 봉투는 그대로 통과)
    location /api/ {
        proxy_pass http://server:3000;   # Spring이면 server:8080
        error_page 502 504 = @api_unavailable;
    }

    location = /health {
        proxy_pass http://server:3000;   # 외부 가동 감시용 (ops.md 7절). Spring이면 /actuator/health로:
                                         #   proxy_pass http://server:8080/actuator/health;
    }

    location / {
        proxy_pass http://client:8080;   # client(nginx)가 SPA fallback 처리
        error_page 502 504 = @page_unavailable;
    }

    # /health에는 걸지 않는다 — 가동 감시는 진짜 502를 봐야 한다
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"message":"서비스 점검 중입니다. 잠시 후 다시 시도해 주세요.","error":"SERVICE_UNAVAILABLE"}';
    }

    location @page_unavailable {
        default_type text/html;
        add_header Cache-Control "no-store" always;   # 복구 후에도 안내 페이지가 캐시로 보이는 것 방지
        return 503 '<!doctype html><meta charset="utf-8"><title>점검 중</title><p>서비스 점검 중입니다. 잠시 후 새로고침해 주세요.</p>';
    }
}
